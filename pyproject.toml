[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-cyclone"
version = "1.0.0"
description = "Aegis-Cyclone: Anticipatory Exposure & Geospatial Intelligence System for Coastal Cyclones"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aegis Systems Architecture Team", email = "ops@aegis-cyclone.gov.in" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-genai>=2.0.0",
    "streamlit>=1.40.0",
    "folium>=0.17.0",
    "streamlit-folium>=0.23.0",
    "earthengine-api>=1.4.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-jose>=3.3.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
